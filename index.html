        #start-screen h1 { color: #007bff; margin-bottom: 10px; }

        .start-btn:active { background: #218838; transform: scale(0.98); }

        #app-container { display: none; position: fixed; top: 0; bottom: 0; left: 0; right: 0; flex-direction: column; background: #fff; }
        .gps-warning { background: #ffcccc; color: #900; padding: 10px; font-size: 14px; text-align: center; display: none; font-weight: bold; border-bottom: 2px solid #f00; z-index: 2000; flex-shrink: 0; }

        .map-wrapper { flex: 1; position: relative; width: 100%; min-height: 0; }
        #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        .gps-status { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.3); z-index: 1500; transition: all 0.3s ease; }
        .gps-status.on { background: #28a745; color: white; }
        .gps-status.off { background: #dc3545; color: white; }

        .controls { flex-shrink: 0; background: #fff; width: 100%; box-sizing: border-box; z-index: 5000; position: relative; box-shadow: 0 -4px 15px rgba(0,0,0,0.15); padding: 15px; padding-bottom: calc(15px + env(safe-area-inset-bottom, 10px)); }
        .btn-group { display: flex; gap: 10px; margin-bottom: 12px; align-items: stretch; width: 100%; box-sizing: border-box; }
        
        button.action-btn { flex: 1; padding: 14px 5px; font-size: 15px; border: none; border-radius: 8px; background: #007bff; color: white; font-weight: bold; display: flex; justify-content: center; align-items: center; box-sizing: border-box; }
        button.action-btn:active { background: #0056b3; }
        button.action-btn:disabled { background: #ccc; }

        #btn-locate { flex: 0 0 54px; min-width: 54px; background: #fff; border: 2px solid #007bff; padding: 0; box-sizing: border-box; }
        #btn-locate:active { background: #e6f0ff; }
        #btn-locate svg { width: 26px; height: 26px; fill: #007bff; display: block; }

        .info { text-align: center; font-size: 14px; color: #333; margin-bottom: 5px; line-height: 1.4; }
        .poi-title { font-weight: bold; color: #007bff; font-size: 16px; display: block; margin-top: 5px; line-height: 1.3; }
        .landmark-title { color: #e67e22 !important; }
        
        /* Версия для проверки кэша */
        .version-tag { text-align: center; font-size: 10px; color: #aaa; margin-top: 5px; }

</head>

<div id="start-screen">

    <p>Для работы приложения и воспроизведения аудио по GPS необходим доступ к вашему местоположению.</p>
    <button class="start-btn" onclick="startApp()">▶ Разрешить GPS и начать</button>
</div>

<div id="app-container">
    <div id="gps-warning" class="gps-warning">

        </div>
    </div>

    <div class="controls">
        <div class="btn-group">
            <button id="btn-prev" class="action-btn" disabled>◀ Назад</button>
            <button id="btn-locate" class="action-btn" title="Вернуться на мое место">

        </div>
