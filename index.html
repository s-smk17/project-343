<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аудиогид 343Э (Умный поиск точек)</title>
</head>
<body>
    <h1>Аудиогид 343Э</h1>
    <p id="status">Ожидание геолокации...</p>
    <button id="startBtn">Запустить гид (требуется для разрешения звука)</button>

    <script>
        // 1. Список ваших остановок. Обратите внимание: id теперь с точкой!
        // Вам нужно будет проставить реальные координаты.
        const points = [
            { id: 1.0,  name: "Ломоносов – Вокзал", lat: 59.9145, lon: 29.7720 },
            { id: 2.0,  name: "Ломоносовская межрайонная больница", lat: 59.9080, lon: 29.7800 },
            { id: 12.0, name: "Улица Связи (пример)", lat: 59.8900, lon: 29.8000 },
            { id: 12.1, name: "Новогорская улица (пример)", lat: 59.8850, lon: 29.8100 },
            { id: 12.5, name: "Улица Жоры Антоненко (пример)", lat: 59.8800, lon: 29.8200 }, // <- Для этого сработает файл 0125
            { id: 12.8, name: "Мордвиновка (пример)", lat: 59.8750, lon: 29.8300 },
            { id: 30.0, name: "Станция метро Проспект Ветеранов", lat: 59.8480, lon: 30.1600 }
        ];

        // 2. Ваши аудиофайлы
        const audioFiles = [
            "01.mp3", 
            "02.mp3", 
            "012.mp3",  // сработает для 12.0
            "0125.mp3", // сработает для 12.5 (так как 12.5 есть в списке)
            "0129.mp3", // 12.9 нет в списке, сработает для ближайшей (12.8)
            "030.mp3"
        ];

        // Функция преобразования имени файла в ID: "0125" -> 12.5
        function parseFileNameToId(fileName) {
            let numStr = fileName.split('.')[0]; // Берем "0125"
            
            // Убираем ведущий ноль
            if (numStr.startsWith('0')) {
                numStr = numStr.substring(1);
            }
            
            // Если осталась одна цифра, добавляем .0 (например "01" -> "1" -> 1.0)
            if (numStr.length === 1) {
                return parseFloat(numStr + ".0");
            }

            // Вставляем точку перед последней цифрой: "125" -> "12.5"
            if (numStr.length > 1) {
                numStr = numStr.slice(0, -1) + '.' + numStr.slice(-1);
            }
            
            return parseFloat(numStr);
        }

        // Функция умного поиска точки
        function findBestPointMatch(targetId, allPoints) {
            // 1. Ищем точное совпадение
            let exactMatch = allPoints.find(p => p.id === targetId);
            if (exactMatch) return { point: exactMatch, matchType: 'точное' };

            // 2. Ищем точки с такой же целой частью (например, для 12.9 ищем среди 12.x)
            let integerPart = Math.floor(targetId);
            let sameIntegerPoints = allPoints.filter(p => Math.floor(p.id) === integerPart);
            
            if (sameIntegerPoints.length > 0) {
                // Сортируем по разнице и берем самую близкую
                sameIntegerPoints.sort((a, b) => Math.abs(a.id - targetId) - Math.abs(b.id - targetId));
                return { point: sameIntegerPoints[0], matchType: 'похожая (та же целая часть)' };
            }

            // 3. Если вообще ничего нет, ищем математически ближайшую точку на маршруте
            if (allPoints.length > 0) {
                let sortedAll = [...allPoints].sort((a, b) => Math.abs(a.id - targetId) - Math.abs(b.id - targetId));
                return { point: sortedAll[0], matchType: 'ближайшая по номеру' };
            }

            return null;
        }

        // Создаем карту аудиофайлов с учетом умного поиска
        const audioMap = {};
        audioFiles.forEach(file => {
            const parsedId = parseFileNameToId(file);
            const matchResult = findBestPointMatch(parsedId, points);
            
            if (matchResult && matchResult.point) {
                // Если для этой точки уже есть файл, не перезаписываем его (приоритет точного совпадения)
                if (!audioMap[matchResult.point.id]) {
                    audioMap[matchResult.point.id] = {
                        file: file,
                        originalId: parsedId,
                        matchType: matchResult.matchType
                    };
                    console.log(`Файл ${file} (ID ${parsedId}) привязан к точке ${matchResult.point.id} (${matchResult.matchType})`);
                }
            }
        });

        // Дальше - стандартная логика геолокации
        const RADIUS_METERS = 50; 
        let lastPlayedPointId = null;
        let currentAudio = new Audio();
        let isStarted = false;

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; 
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function startTracking() {
            if (!navigator.geolocation) return;

            navigator.geolocation.watchPosition((position) => {
                const userLat = position.coords.latitude;
                const userLon = position.coords.longitude;

                points.forEach(point => {
                    const distance = getDistance(userLat, userLon, point.lat, point.lon);

                    if (distance <= RADIUS_METERS && lastPlayedPointId !== point.id) {
                        const audioData = audioMap[point.id];

                        if (audioData) {
                            document.getElementById('status').innerText = `Точка ${point.id} (${audioData.matchType}). Играет: ${audioData.file}`;
                            
                            currentAudio.pause();
                            currentAudio.src = audioData.file;
                            currentAudio.play().catch(e => console.error("Ошибка звука:", e));

                            lastPlayedPointId = point.id; 
                            
                            setTimeout(() => {
                                if (lastPlayedPointId === point.id) lastPlayedPointId = null;
                            }, 120000); // Сброс через 2 минуты
                        }
                    }
                });
            }, (error) => {
                document.getElementById('status').innerText = "Ошибка GPS: " + error.message;
            }, {
                enableHighAccuracy: true,
                maximumAge: 0,
                timeout: 5000
            });
        }

        document.getElementById('startBtn').addEventListener('click', () => {
            if (!isStarted) {
                currentAudio.play().catch(() => {});
                isStarted = true;
                startTracking();
                document.getElementById('startBtn').style.display = 'none';
            }
        });
    </script>
</body>
</html>
