<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аудиогид 343Э</title>
    <style>
        #status { padding: 10px; font-weight: bold; }
        .error { color: red; }
        .success { color: green; }
        .warning { color: orange; }
    </style>
</head>
<body>
    <h1>Аудиогид 343Э</h1>
    <div id="status">Ожидание запуска...</div>
    <button id="startBtn" style="padding: 10px 20px; font-size: 16px;">Запустить гид</button>

    <script>
        // --- ВАШИ ДАННЫЕ ---
        const points = [
            { id: 1.0,  name: "Ломоносов – Вокзал", lat: 59.9145, lon: 29.7720 },
            { id: 2.0,  name: "Ломоносовская межрайонная больница", lat: 59.9080, lon: 29.7800 },
            { id: 12.0, name: "Улица Связи (пример)", lat: 59.8900, lon: 29.8000 },
            { id: 12.1, name: "Новогорская улица (пример)", lat: 59.8850, lon: 29.8100 },
            { id: 12.5, name: "Улица Жоры Антоненко (пример)", lat: 59.8800, lon: 29.8200 },
            { id: 12.8, name: "Мордвиновка (пример)", lat: 59.8750, lon: 29.8300 },
            { id: 30.0, name: "Станция метро Проспект Ветеранов", lat: 59.8480, lon: 30.1600 }
        ];

        const audioFiles = ["01.mp3", "02.mp3", "012.mp3", "0125.mp3", "0129.mp3", "030.mp3"];

        // --- ЛОГИКА ПОИСКА ФАЙЛОВ ---
        function parseFileNameToId(fileName) {
            let numStr = fileName.split('.')[0];
            if (numStr.startsWith('0')) numStr = numStr.substring(1);
            if (numStr.length === 1) return parseFloat(numStr + ".0");
            if (numStr.length > 1) numStr = numStr.slice(0, -1) + '.' + numStr.slice(-1);
            return parseFloat(numStr);
        }

        function findBestPointMatch(targetId, allPoints) {
            let exactMatch = allPoints.find(p => p.id === targetId);
            if (exactMatch) return { point: exactMatch, matchType: 'точное' };

            let integerPart = Math.floor(targetId);
            let sameIntegerPoints = allPoints.filter(p => Math.floor(p.id) === integerPart);
            if (sameIntegerPoints.length > 0) {
                sameIntegerPoints.sort((a, b) => Math.abs(a.id - targetId) - Math.abs(b.id - targetId));
                return { point: sameIntegerPoints[0], matchType: 'похожая (та же целая часть)' };
            }

            if (allPoints.length > 0) {
                let sortedAll = [...allPoints].sort((a, b) => Math.abs(a.id - targetId) - Math.abs(b.id - targetId));
                return { point: sortedAll[0], matchType: 'ближайшая по номеру' };
            }
            return null;
        }

        const audioMap = {};
        audioFiles.forEach(file => {
            const parsedId = parseFileNameToId(file);
            const matchResult = findBestPointMatch(parsedId, points);
            if (matchResult && matchResult.point && !audioMap[matchResult.point.id]) {
                audioMap[matchResult.point.id] = { file: file, originalId: parsedId, matchType: matchResult.matchType };
            }
        });

        // --- ГЕОЛОКАЦИЯ И ИСПРАВЛЕНИЕ ОШИБОК ---
        const RADIUS_METERS = 50; 
        let lastPlayedPointId = null;
        let currentAudio = new Audio();
        let isStarted = false;
        let watchId = null;
        let retryCount = 0;

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; 
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        // Функция обновления статуса
        function updateStatus(text, className) {
            const el = document.getElementById('status');
            el.innerText = text;
            el.className = className || '';
        }

        // ОБРАБОТКА ОШИБОК GPS
        function handleLocationError(error) {
            console.error("GPS Error:", error);
            let errorMsg = "";
            
            switch(error.code) {
                case error.PERMISSION_DENIED:
                    errorMsg = "❌ Доступ к GPS запрещен. Разрешите геолокацию в настройках браузера для этого сайта.";
                    updateStatus(errorMsg, "error");
                    break;
                case error.POSITION_UNAVAILABLE:
                    errorMsg = "📡 Сигнал GPS не найден. Включите GPS на телефоне или выйдите на улицу.";
                    updateStatus(errorMsg, "warning");
                    retryGPS();
                    break;
                case error.TIMEOUT:
                    errorMsg = "⏱️ GPS не успел ответить. Пробуем еще раз...";
                    updateStatus(errorMsg, "warning");
                    retryGPS();
                    break;
                default:
                    errorMsg = "⚠️ Неизвестная ошибка GPS: " + error.message;
                    updateStatus(errorMsg, "error");
                    retryGPS();
                    break;
            }
        }

        // Автоматический перезапуск при таймауте или плохом сигнале
        function retryGPS() {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
            }
            retryCount++;
            if (retryCount < 5) { // Пробуем 5 раз
                setTimeout(() => {
                    updateStatus(`Повторная попытка подключения к GPS (${retryCount}/5)...`, "warning");
                    startTracking();
                }, 3000);
            } else {
                updateStatus("Не удалось получить GPS. Проверьте настройки геолокации.", "error");
            }
        }

        function startTracking() {
            if (!navigator.geolocation) {
                updateStatus("❌ Ваш браузер не поддерживает геолокацию.", "error");
                return;
            }

            // ВАЖНО: Увеличен timeout до 20 секунд (20000 мс) для холодного старта GPS
            watchId = navigator.geolocation.watchPosition(
                (position) => {
                    // Если получили координаты — сбрасываем счетчик ошибок
                    retryCount = 0; 
                    updateStatus("✅ GPS работает. Следим за маршрутом...", "success");

                    const userLat = position.coords.latitude;
                    const userLon = position.coords.longitude;

                    points.forEach(point => {
                        const distance = getDistance(userLat, userLon, point.lat, point.lon);

                        if (distance <= RADIUS_METERS && lastPlayedPointId !== point.id) {
                            const audioData = audioMap[point.id];

                            if (audioData) {
                                updateStatus(`🔊 Точка ${point.id}: ${point.name}. Играет: ${audioData.file}`, "success");
                                
                                currentAudio.pause();
                                currentAudio.src = audioData.file;
                                currentAudio.play().catch(e => {
                                    console.error("Ошибка звука:", e);
                                    updateStatus("⚠️ Нажмите на экран, чтобы разрешить воспроизведение звука!", "warning");
                                });

                                lastPlayedPointId = point.id; 
                                setTimeout(() => { if (lastPlayedPointId === point.id) lastPlayedPointId = null; }, 120000);
                            }
                        }
                    });
                }, 
                handleLocationError, // Вызываем нашу новую функцию обработки ошибок
                {
                    enableHighAccuracy: true, // Требуем максимальную точность (использовать GPS, а не Wi-Fi)
                    maximumAge: 10000,        // Разрешаем кэшировать координаты на 10 секунд (меньше нагрузка)
                    timeout: 20000            // ЖДЕМ 20 СЕКУНД ВМЕСТО 5
                }
            );
        }

        document.getElementById('startBtn').addEventListener('click', () => {
            if (!isStarted) {
                // Проверка на безопасное соединение (HTTPS)
                if (window.location.protocol !== "https:" && window.location.hostname !== "localhost" && window.location.hostname !== "127.0.0.1") {
                    updateStatus("⚠️ GPS не работает по протоколу HTTP! Открывайте сайт только по ссылке HTTPS.", "error");
                    return;
                }

                // Разблокировка аудио
                currentAudio.play().catch(() => {});
                isStarted = true;
                document.getElementById('startBtn').style.display = 'none';
                updateStatus("Запрос доступа к GPS...", "warning");
                startTracking();
            }
        });
    </script>
</body>
</html>
